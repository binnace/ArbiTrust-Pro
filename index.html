<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-DEX Pro | Ultra Fast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        /* High Performance CSS */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #080a0f; color: #e5e7eb; font-family: 'Inter', sans-serif; margin: 0; overscroll-behavior: none; }
        .panel { background: #11141d; border: 1px solid #1f2937; transform: translateZ(0); } /* GPU boost */
        .input-box { background: #1a1e2c; border: 1px solid #374151; border-radius: 6px; padding: 12px; width: 100%; color: white; outline: none; -webkit-appearance: none; }
        .bdex-logo { width: 40px; height: 40px; background: linear-gradient(135deg, #facc15 0%, #eab308 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: black; font-size: 22px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <nav class="h-14 border-b border-gray-800 flex items-center justify-between px-4 bg-[#11141d] z-50">
        <div class="flex items-center gap-3">
            <div class="bdex-logo text-lg">B</div>
            <span class="text-lg font-black tracking-tighter">B-DEX <span class="text-blue-500 italic text-xs">PRO</span></span>
        </div>
        <button id="connectBtn" onclick="connectWallet()" class="bg-blue-600 px-4 py-2 rounded font-bold text-[10px] uppercase tracking-wider text-white">Connect</button>
    </nav>

    <main class="flex-1 flex flex-col md:grid md:grid-cols-12 gap-1 p-1 overflow-y-auto custom-scroll">
        
        <div class="h-[300px] md:h-auto md:col-span-6 panel relative overflow-hidden order-1">
            <div id="tradingview_chart" class="w-full h-full"></div>
        </div>

        <div class="md:col-span-3 panel p-3 order-3 md:order-2">
            <div class="flex justify-between text-[10px] font-bold text-gray-500 uppercase mb-2"><span>Price</span><span>Size</span></div>
            <div id="orderbook" class="space-y-1 text-xs font-mono">
                <div class="flex justify-between text-red-500"><span>3512.40</span><span>0.150</span></div>
                <div class="py-2 text-center text-xl font-black text-green-500 border-y border-gray-800 my-2">3507.00</div>
                <div class="flex justify-between text-green-500"><span>3501.50</span><span>3.120</span></div>
            </div>
        </div>

        <div class="md:col-span-3 panel p-4 order-2 md:order-3">
            <div class="flex gap-1 p-1 bg-gray-900 rounded-lg mb-4">
                <button class="w-1/2 py-2 bg-green-600 rounded text-[10px] font-bold">BUY</button>
                <button class="w-1/2 py-2 text-gray-500 text-[10px] font-bold">SELL</button>
            </div>
            <div class="space-y-4">
                <input type="number" class="input-box" placeholder="Price (BUSD)">
                <input type="number" class="input-box" placeholder="Amount (ETH)">
                <div class="flex justify-between text-[10px] font-bold text-gray-500 px-1">
                    <span>Balance:</span><span id="busdBalance" class="text-yellow-500">0.00 BUSD</span>
                </div>
                <button onclick="placeOrder()" class="w-full py-4 bg-blue-600 rounded-lg font-black text-xs uppercase tracking-widest shadow-lg active:scale-95 transition-all">Place Order</button>
            </div>
        </div>
    </main>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // Efficient Chart Loading
        window.onload = function() {
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:ETHUSDT",
                "interval": "15", // Higher interval = less data load
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#11141d",
                "enable_publishing": false,
                "hide_top_toolbar": true, // Hide toolbar for speed
                "hide_legend": true,
                "save_image": false,
                "container_id": "tradingview_chart",
                "library_path": "https://s3.tradingview.com/tv.js"
            });
        };

        const BUSD_ADDRESS = "0x25d34817D4205fE605b4C65Ed3Be83C85107d333";
        const ABI = ["function balanceOf(address owner) view returns (uint256)"];
        let provider, account;

        async function connectWallet() {
            if (window.ethereum) {
                provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                account = accounts[0];
                document.getElementById('connectBtn').innerText = account.substring(0,5) + "...";
                updateBalance();
            }
        }

        async function updateBalance() {
            if(!account) return;
            const contract = new ethers.Contract(BUSD_ADDRESS, ABI, provider);
            const bal = await contract.balanceOf(account);
            document.getElementById('busdBalance').innerText = parseFloat(ethers.formatUnits(bal, 18)).toLocaleString() + " BUSD";
        }

        function placeOrder() { alert("Order placed on B-DEX Matcher!"); }
    </script>
</body>
</html>
