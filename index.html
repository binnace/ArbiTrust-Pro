<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-DEX Pro | Institutional Grade DEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; touch-action: manipulation; }
        .dydx-panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
        .tab-content { display: none; height: calc(100vh - 130px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .active-tab { display: block; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; filter: grayscale(1); }
        .nav-btn.active { color: #58a6ff; border-top: 2px solid #58a6ff; }
        .nav-btn.active .nav-icon { filter: grayscale(0); }
        .buy-green { background-color: #238636; color: white; }
        .sell-red { background-color: #da3633; color: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"] { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; color: white; width: 100%; outline: none; }
        .bdex-logo { width: 32px; height: 32px; background: #f2bc1b; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #000; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="h-14 border-b border-[#30363d] flex items-center justify-between px-4 bg-[#161b22] shrink-0">
        <div class="flex items-center gap-3">
            <div class="bdex-logo text-xs">B</div>
            <div class="flex flex-col">
                <span class="text-sm font-bold text-white tracking-tight">ETH-BUSD</span>
                <span class="text-[10px] text-green-500 font-medium">$3,507.25 <span class="text-gray-500">+1.2%</span></span>
            </div>
        </div>
        <button id="connectBtn" onclick="connectWallet()" class="bg-[#21262d] border border-[#30363d] px-4 py-1.5 rounded-md text-xs font-semibold text-[#58a6ff] hover:bg-[#30363d] transition-all">Connect</button>
    </header>

    <main class="flex-1 overflow-hidden relative">
        
        <div id="markets" class="tab-content active-tab px-4 pt-4">
            <div class="flex justify-between items-end mb-4">
                <h1 class="text-xl font-bold text-white">All Markets</h1>
                <span class="text-xs text-gray-500">Vol: $4.2M</span>
            </div>
            <div class="space-y-1">
                <div onclick="switchTab('trade')" class="flex justify-between items-center py-4 border-b border-[#21262d] active:bg-[#161b22]">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold text-white text-xs">Ξ</div>
                        <div><p class="text-sm font-bold text-white">Ethereum</p><p class="text-[10px] text-gray-500">ETH</p></div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-white">$3,507.25</p>
                        <p class="text-[10px] text-green-500">+2.45%</p>
                    </div>
                </div>
                <div class="flex justify-between items-center py-4 border-b border-[#21262d] opacity-60">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center font-bold text-white text-xs">₿</div>
                        <div><p class="text-sm font-bold text-white">Bitcoin</p><p class="text-[10px] text-gray-500">BTC</p></div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-white">$67,120</p>
                        <p class="text-[10px] text-red-500">-0.15%</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="trade" class="tab-content">
            <div class="h-[45%] w-full border-b border-[#30363d]" id="tv_container">
                <div id="tradingview_chart" class="w-full h-full"></div>
            </div>
            <div class="p-4 space-y-4">
                <div class="flex gap-2 p-1 bg-[#0d1117] border border-[#30363d] rounded-lg">
                    <button class="w-1/2 py-2 buy-green rounded-md text-[10px] font-extrabold uppercase">Buy</button>
                    <button class="w-1/2 py-2 text-gray-500 text-[10px] font-extrabold uppercase">Sell</button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Price (BUSD)</p>
                        <input type="number" value="3507.25">
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Amount (ETH)</p>
                        <input type="number" placeholder="0.0">
                    </div>
                </div>
                <button onclick="placeOrder()" class="w-full py-4 buy-green rounded-xl font-black text-xs uppercase tracking-widest shadow-2xl">Place Order</button>
                <div class="flex justify-between text-[10px] font-bold text-gray-500">
                    <span>Account Balance</span>
                    <span id="busdBalance" class="text-white">0.00 BUSD</span>
                </div>
            </div>
        </div>

        <div id="portfolio" class="tab-content px-4 pt-6">
            <div class="dydx-panel p-6 mb-4">
                <p class="text-xs text-gray-500 font-bold uppercase mb-1">Total Margin Equity</p>
                <h2 id="totalEquity" class="text-3xl font-black text-white">$0.00</h2>
            </div>
            <div class="space-y-4">
                <h3 class="text-sm font-bold text-white">Assets</h3>
                <div class="flex justify-between items-center p-3 border-b border-[#30363d]">
                    <span class="text-sm">Bharat BUSD</span>
                    <span id="assetBal" class="text-sm font-bold">0.00</span>
                </div>
            </div>
        </div>

    </main>

    <footer class="h-16 bg-[#161b22] border-t border-[#30363d] flex justify-around shrink-0">
        <button onclick="switchTab('markets')" class="nav-btn flex-1 flex flex-col items-center justify-center active">
            <span class="nav-icon">📊</span><span class="text-[9px] font-bold uppercase">Markets</span>
        </button>
        <button onclick="switchTab('trade')" class="nav-btn flex-1 flex flex-col items-center justify-center">
            <span class="nav-icon">🔄</span><span class="text-[9px] font-bold uppercase">Trade</span>
        </button>
        <button onclick="switchTab('portfolio')" class="nav-btn flex-1 flex flex-col items-center justify-center">
            <span class="nav-icon">💰</span><span class="text-[9px] font-bold uppercase">Portfolio</span>
        </button>
    </footer class="h-16">

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let tvWidget = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active-tab');
            event.currentTarget.classList.add('active');

            if(tabId === 'trade' && !tvWidget) {
                tvWidget = new TradingView.widget({
                    "autosize": true, "symbol": "BINANCE:ETHUSDT", "interval": "15",
                    "theme": "dark", "style": "1", "container_id": "tradingview_chart",
                    "hide_top_toolbar": true, "backgroundColor": "#0d1117", "gridColor": "#30363d"
                });
            }
        }

        async function connectWallet() {
            if (window.ethereum) {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                document.getElementById('connectBtn').innerText = accounts[0].substring(0,6) + "...";
                
                const BUSD_ADDRESS = "0x25d34817D4205fE605b4C65Ed3Be83C85107d333";
                const contract = new ethers.Contract(BUSD_ADDRESS, ["function balanceOf(address) view returns (uint256)"], provider);
                const bal = await contract.balanceOf(accounts[0]);
                const formatted = parseFloat(ethers.formatUnits(bal, 18)).toLocaleString();
                
                document.getElementById('busdBalance').innerText = formatted + " BUSD";
                document.getElementById('totalEquity').innerText = "$" + formatted;
                document.getElementById('assetBal').innerText = formatted;
            }
        }

        function placeOrder() { alert("B-DEX: Order placed at current index price!"); }
    </script>
</body>
</html>
