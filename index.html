<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-DEX Pro | Institutional Grade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0e14; --panel: #161920; --border: #232833; --dydx-blue: #6966ff; --green: #00c087; --red: #ff3b5a; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .tab-content { display: none; height: calc(100vh - 75px); overflow-y: auto; padding-bottom: 90px; }
        .active-tab { display: block !important; }
        .bottom-nav { background: #161920; border-top: 1px solid var(--border); height: 75px; position: fixed; bottom: 0; width: 100%; display: flex; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8c93a3; font-size: 10px; font-weight: 600; cursor: pointer; border-top: 2px solid transparent; }
        .nav-item.active { color: white; border-top: 2px solid var(--dydx-blue); background: linear-gradient(180deg, rgba(105, 102, 255, 0.1) 0%, transparent 100%); }
        .market-row { border-bottom: 1px solid var(--border); padding: 14px 0; display: flex; justify-content: space-between; align-items: center; transition: 0.1s; }
        .market-row:active { background: #1c212e; }
        .trade-btn { height: 45px; border-radius: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; width: 100%; transition: 0.2s; }
        .buy { background: var(--green); }
        .sell { background: var(--red); opacity: 0.4; }
        input { background: #1c212e; border: 1px solid var(--border); border-radius: 8px; color: white; padding: 12px; font-weight: 700; width: 100%; outline: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="h-14 border-b border-[#232833] flex items-center justify-between px-4 bg-[#0b0e14] sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-[#facc15] rounded flex items-center justify-center font-black text-black text-xs">B</div>
            <span class="font-bold tracking-tight">ETH-BUSD</span>
        </div>
        <button id="connectBtn" onclick="connectWallet()" class="text-[var(--dydx-blue)] font-bold text-xs bg-[var(--dydx-blue)]/10 px-4 py-1.5 rounded-full">Connect</button>
    </header>

    <div id="markets-screen" class="tab-content active-tab px-4">
        <div class="py-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Markets</h1>
            <div class="bg-[#1c212e] p-2 rounded-full"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        </div>
        <div class="flex gap-6 border-b border-gray-800 text-xs font-bold uppercase text-gray-500 mb-2">
            <span class="text-white border-b-2 border-[var(--dydx-blue)] pb-2">All</span>
            <span>Layer 2</span>
            <span>AI</span>
        </div>
        <div id="market-list">
            <div class="market-row" onclick="switchTab('trade')">
                <div class="flex items-center gap-3">
                    <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" class="w-8 h-8">
                    <div><p class="font-bold">ETH-BUSD</p><p class="text-[10px] text-gray-500">Ethereum</p></div>
                </div>
                <div class="text-right">
                    <p class="font-bold">$3,501.20</p>
                    <p class="text-xs text-[var(--green)]">+1.25%</p>
                </div>
            </div>
        </div>
    </div>

    <div id="trade-screen" class="tab-content">
        <div id="tv-chart" class="h-64 w-full border-b border-gray-800 bg-black"></div>
        <div class="p-4 space-y-4">
            <div class="flex bg-[#161920] p-1 rounded-lg gap-1 dydx-border">
                <button class="trade-btn buy text-xs">Buy</button>
                <button class="trade-btn sell text-xs">Sell</button>
            </div>
            <div class="space-y-4">
                <div class="relative"><span class="absolute left-3 top-3.5 text-[10px] text-gray-500 font-bold uppercase">Price</span><input type="number" class="text-right pr-4" value="3501.20"></div>
                <div class="relative"><span class="absolute left-3 top-3.5 text-[10px] text-gray-500 font-bold uppercase">Amount</span><input type="number" class="text-right pr-4" placeholder="0.00"></div>
            </div>
            <div class="flex justify-between text-[10px] font-bold text-gray-500 px-1">
                <span>Account Value</span><span id="busdBal" class="text-white">$0.00 BUSD</span>
            </div>
            <button onclick="placeOrder()" class="trade-btn buy w-full mt-2 text-sm shadow-lg shadow-emerald-900/20">Place Market Order</button>
        </div>
    </div>

    <div id="portfolio-screen" class="tab-content px-4">
        <h1 class="text-2xl font-bold py-6">Portfolio</h1>
        <div class="bg-[#161920] p-6 rounded-2xl mb-6 border border-gray-800">
            <p class="text-xs font-bold text-gray-500 uppercase mb-1">Total Equity</p>
            <h2 id="totalEq" class="text-4xl font-black">$0.00</h2>
        </div>
        <div class="flex justify-between text-[10px] font-bold text-gray-500 border-b border-gray-800 pb-2 mb-4">
            <span class="text-white border-b-2 border-[var(--dydx-blue)] pb-2">Assets</span>
            <span>Positions</span>
            <span>Orders</span>
        </div>
        <div class="flex justify-between items-center py-2">
            <div class="flex items-center gap-3"><div class="w-8 h-8 bg-yellow-500 rounded-full flex items-center justify-center font-black text-black">B</div><p class="font-bold">Bharat BUSD</p></div>
            <p id="assetBal" class="font-bold">0.00</p>
        </div>
    </div>

    <footer class="bottom-nav">
        <div onclick="switchTab('markets')" class="nav-item active" id="nav-markets"><svg class="mb-1" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 3v18h18"/><path d="M18 9l-6 6-2-2-4 4"/></svg>Markets</div>
        <div onclick="switchTab('trade')" class="nav-item" id="nav-trade"><svg class="mb-1" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>Trade</div>
        <div onclick="switchTab('portfolio')" class="nav-item" id="nav-portfolio"><svg class="mb-1" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/></svg>Portfolio</div>
        <div class="nav-item opacity-30"><svg class="mb-1" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M3 12h3m12 0h3M12 3v3m0 12v3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6l2.1-2.1"/></svg>Vault</div>
    </footer>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let tvInited = false;
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id + '-screen').classList.add('active-tab');
            document.getElementById('nav-' + id).classList.add('active');

            if(id === 'trade' && !tvInited) {
                new TradingView.widget({
                    "autosize": true, "symbol": "BINANCE:ETHUSDT", "interval": "1", "theme": "dark", "style": "1",
                    "container_id": "tv-chart", "hide_top_toolbar": true, "backgroundColor": "#0b0e14"
                });
                tvInited = true;
            }
        }

        async function connectWallet() {
            if (window.ethereum) {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                const acc = accounts[0];
                document.getElementById('connectBtn').innerText = acc.substring(0,6) + "...";
                
                const BUSD = "0x25d34817D4205fE605b4C65Ed3Be83C85107d333";
                const contract = new ethers.Contract(BUSD, ["function balanceOf(address) view returns (uint256)"], provider);
                const bal = await contract.balanceOf(acc);
                const val = parseFloat(ethers.formatUnits(bal, 18)).toLocaleString();
                document.getElementById('busdBal').innerText = "$" + val + " BUSD";
                document.getElementById('totalEq').innerText = "$" + val;
                document.getElementById('assetBal').innerText = val;
            }
        }

        function placeOrder() { alert("B-DEX: Order placed on matching engine!"); }
    </script>
</body>
</html>
